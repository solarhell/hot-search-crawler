name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "archives/**"
      - "README.md"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: deploy/cloudflare-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run
